<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Outer shield -->
  <path d="M100 10 L175 42 L175 105 C175 148 100 185 100 185 C100 185 25 148 25 105 L25 42 Z"
        fill="#1e40af" stroke="#3b82f6" stroke-width="3"/>

  <!-- Inner shield highlight -->
  <path d="M100 28 L158 54 L158 105 C158 138 100 168 100 168 C100 168 42 138 42 105 L42 54 Z"
        fill="#1e3a8a" stroke="#60a5fa" stroke-width="1.5" opacity="0.6"/>

  <!-- Checkmark / rail track lines (the "rail" metaphor) -->
  <line x1="62" y1="100" x2="138" y2="100" stroke="#60a5fa" stroke-width="5" stroke-linecap="round"/>
  <line x1="62" y1="113" x2="138" y2="113" stroke="#60a5fa" stroke-width="5" stroke-linecap="round"/>

  <!-- Tie marks (railway sleepers) -->
  <line x1="78"  y1="94"  x2="78"  y2="119" stroke="#93c5fd" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="100" y1="94"  x2="100" y2="119" stroke="#93c5fd" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="122" y1="94"  x2="122" y2="119" stroke="#93c5fd" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Proof checkmark -->
  <polyline points="72,76 88,92 128,58"
            stroke="#34d399" stroke-width="6"
            stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
